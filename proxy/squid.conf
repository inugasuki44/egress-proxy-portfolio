# --------------------------------------------------
# 1. 送信元の定義 (Docker内部ネットワーク全体を許可対象とする)
# --------------------------------------------------
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# --------------------------------------------------
# 2. 許可する宛先リストの定義 (★ここがポイント)
# --------------------------------------------------
# 直書きするのではなく、同階層にある allow-list.txt を読み込む設定にします。
# (※後ほどActionsがJSONからこのtxtファイルを作ってくれる想定です)
acl allowed_domains dstdomain "/etc/squid/allow-list.txt"

# --------------------------------------------------
# 3. セキュリティ設定 (HTTPSトンネリング用)
# --------------------------------------------------
# HTTPS(443)以外のポートへのCONNECT(トンネリング)を禁止し、不正利用を防ぐ
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# --------------------------------------------------
# 4. アクセス制御ルール (上から順に評価される)
# --------------------------------------------------
# ルール1: 送信元が localnet(コンテナ) で、かつ宛先が allowed_domains の場合のみ「許可」
http_access allow localnet allowed_domains

# ルール2: それ以外のすべての通信を「拒否」 (最強の防波堤)
http_access deny all

# --------------------------------------------------
# 5. プロキシの待ち受けポート
# --------------------------------------------------
http_port 3128